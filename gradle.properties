# This machine has 7.7 GiB and no swap, and a Wear emulator can be running at the same time, so the
# JVM budgets are deliberately modest: an over-large Gradle heap gets the daemon OOM-killed
# mid-build. Kotlin compilation happens in its own daemon, hence the separate cap.
org.gradle.jvmargs=-Xmx1600m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1400m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
